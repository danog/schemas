name: Main

on:
  push:
    # Not the branches of pull requests (like the daily build of MadelineProto's): every installation of
    # MadelineProto would download their schemas.
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: latest
        run: node .github/scripts/release.js
